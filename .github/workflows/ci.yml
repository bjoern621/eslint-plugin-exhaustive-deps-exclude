name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor comes from engines.node, the ceiling from the current LTS.
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - uses: go-task/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - run: npm ci

      - run: task test

      - name: Report the local delta against the pinned upstream
        run: task patch:stat

      # A conflict marker compiles under @ts-nocheck, so it is checked for rather than type-checked.
      - run: task markers

      - run: task banner:check
