name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor comes from engines.node, the ceiling from the newest release line.
        node: [20, 22, 24, 26]
        # Every major the peer range accepts.
        eslint: [8, 9, 10]
        # A version here resolves to the newest of its line, so the declared floors ride along as their own legs.
        include:
          - node: 20.19.0
            eslint: 8.57.0
          - node: 22.13.0
            eslint: 8.57.0
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - uses: go-task/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - run: npm ci

      - name: Take the ESLint major under test
        run: npm install --no-save eslint@${{ matrix.eslint }}

      - run: task test

      - name: Report the local delta against the pinned upstream
        run: task patch:stat

      # A conflict marker compiles under @ts-nocheck, so it is checked for rather than type-checked.
      - run: task markers

      - run: task banner:check
