name: Release

# The registry credential is minted per run through npm trusted publishing,
# configured on the package's npmjs.com settings against this repository and this file name.
on:
  push:
    tags: ["v*"]

permissions:
  # Creating the GitHub release.
  contents: write
  # Trusted publishing exchanges this token for the credential.
  id-token: write

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - run: npm ci

      # Trusted publishing needs npm 11.5.1 or newer, ahead of what node bundles.
      - run: npm install -g npm@latest

      - name: Refuse a tag that disagrees with package.json
        run: |
          version=${GITHUB_REF_NAME#v}
          declared=$(node -p "require('./package.json').version")
          if [ "$version" != "$declared" ]; then
            echo "tag $version, package.json $declared" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_ENV"

      # Ahead of the publish, so a version the changelog skipped is caught while nothing is released.
      - name: Take the release body from the changelog
        run: ./scripts/changelog-section.sh "$version" > notes.md

      # prepack builds lib/, which the tree does not carry.
      - run: npm publish

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file notes.md
